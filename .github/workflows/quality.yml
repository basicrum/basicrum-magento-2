name: Magento code quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} components
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [lowest, stable]
        include:
          - php: '8.3'
            dependencies: locked
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10
          extensions: bcmath, gd, intl, pdo_mysql, soap, sodium, xsl, zip
          coverage: none
      - name: Resolve real Magento components, never test doubles
        working-directory: tests/quality
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          case "$DEPENDENCIES" in
            locked) composer install --prefer-dist --no-scripts --no-interaction ;;
            lowest) composer update --prefer-lowest --prefer-stable --prefer-dist --no-scripts --no-interaction ;;
            stable) composer update --prefer-stable --prefer-dist --no-scripts --no-interaction ;;
          esac
      - name: Record resolved Magento component versions
        working-directory: tests/quality
        run: composer show 'magento/*' --no-interaction
      - name: PHPStan level 8 and Magento coding standards
        run: sh tests/quality/check.sh
      - name: Build and verify production distribution
        if: matrix.dependencies == 'locked'
        run: |
          sh tests/integration/build-artifact.sh
          php tests/integration/test-artifact.php
