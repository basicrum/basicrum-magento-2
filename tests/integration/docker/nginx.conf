upstream fastcgi_backend {
    server php:9000;
}
server {
    listen 8443 ssl;
    server_name web;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    set $MAGE_ROOT /var/www/html;
    # Disposable test challenge only. Magento's standard config otherwise rejects
    # arbitrary PHP files; no such location or endpoint belongs on a real store.
    location ~ "^/basicrum-test-[a-f0-9]{64}\.php$" {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $MAGE_ROOT/pub$fastcgi_script_name;
        fastcgi_pass fastcgi_backend;
    }
    include /var/www/html/nginx.conf.sample;
}
