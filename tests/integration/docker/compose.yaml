# Keep the previous Magento 2.4.7/MariaDB 10.11 volumes untouched.
name: basicrum-release-baseline-248
services:
  php:
    build: .
    volumes:
      - application:/var/www/html
      - ../../..:/module
      - ./php-fpm.conf:/usr/local/etc/php-fpm.conf:ro
    environment:
      BASICRUM_DISPOSABLE_MAGENTO: '1'
      MAGENTO_ROOT: /var/www/html
      MAGENTO_STOREFRONT_URL: https://web:8443/
      MAGENTO_ADMIN_URL: https://web:8443/admin/
      MAGENTO_ADMIN_USERNAME: basicrum-test
      MAGENTO_ADMIN_PASSWORD: local-test-only-9471
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
  web:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    ports:
      - '127.0.0.1:9443:8443'
    volumes:
      - application:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../.test-results/baseline-certs:/certs:ro
    depends_on:
      - php
  db:
    image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
    environment:
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: disposable
      MARIADB_ROOT_PASSWORD: disposable-root
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 30
  search:
    image: opensearchproject/opensearch:3.4.0@sha256:1647ce2e07371f1ac8bbad28890a64ef77c5a694a61f656120f0ace09e66bf48
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9200/_cluster/health']
      interval: 10s
      retries: 60
volumes:
  application:
  database:
