name: basicrum-release-baseline
services:
  php:
    build: .
    volumes:
      - application:/var/www/html
      - ../../..:/module
      - ./php-fpm.conf:/usr/local/etc/php-fpm.conf:ro
    environment:
      BASICRUM_DISPOSABLE_MAGENTO: '1'
      MAGENTO_ROOT: /var/www/html
      MAGENTO_STOREFRONT_URL: https://web:8443/
      MAGENTO_ADMIN_URL: https://web:8443/admin/
      MAGENTO_ADMIN_USERNAME: basicrum-test
      MAGENTO_ADMIN_PASSWORD: local-test-only-9471
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
  web:
    image: markoshust/magento-nginx:1.28-0@sha256:12d211176a5800ef1ebdc909865a0a5ebc691d282a6df438b082ac5587f275de
    ports:
      - '127.0.0.1:9443:8443'
    volumes:
      - application:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../.test-results/baseline-certs:/certs:ro
    depends_on:
      - php
  db:
    image: mariadb:10.11@sha256:07c0aaff7396b74cb7975cba78257178d188e30f531a5db2b617c48beef13c41
    environment:
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: disposable
      MARIADB_ROOT_PASSWORD: disposable-root
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 30
  search:
    image: opensearchproject/opensearch:2.19.4@sha256:9e0b3b3b6805811bd63d9b9503ffe34a58ba33d03cc346000e318c6ff5c05bd9
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9200/_cluster/health']
      interval: 10s
      retries: 60
volumes:
  application:
  database:
